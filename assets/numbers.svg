<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400">
    <stop stop-color="#090908"/>
    <stop offset="1" stop-color="#11110F"/>
  </linearGradient>
</defs>

<rect width="1200" height="400" rx="24" fill="url(#bg)"/>

<text x="52" y="58"
      fill="#F4F1E8"
      font-family="monospace"
      font-size="15"
      letter-spacing="4">
  TIMELINE / EVOLUTION
</text>

<text x="52" y="85"
      fill="#68665F"
      font-family="monospace"
      font-size="11">
  the interesting metric is direction
</text>

<!-- timeline -->
<line x1="100" y1="220" x2="1100" y2="220"
      stroke="#292927"
      stroke-width="3"/>

<line x1="100" y1="220" x2="1100" y2="220"
      stroke="#E4572E"
      stroke-width="2"
      stroke-dasharray="5 12">
  <animate attributeName="stroke-dashoffset"
           from="0"
           to="-100"
           dur="4s"
           repeatCount="indefinite"/>
</line>

<!-- years -->
<g font-family="monospace">
  <g>
    <circle cx="160" cy="220" r="10" fill="#151412" stroke="#55534D"/>
    <text x="160" y="260" text-anchor="middle" fill="#77746B" font-size="10">2023</text>
    <text x="160" y="180" text-anchor="middle" fill="#F4F1E8" font-size="9">UI</text>
  </g>

  <g>
    <circle cx="400" cy="220" r="10" fill="#151412" stroke="#D6A756"/>
    <text x="400" y="260" text-anchor="middle" fill="#77746B" font-size="10">2024</text>
    <text x="400" y="180" text-anchor="middle" fill="#F4F1E8" font-size="9">FULLSTACK</text>
  </g>

  <g>
    <circle cx="650" cy="220" r="10" fill="#151412" stroke="#8B7CFF"/>
    <text x="650" y="260" text-anchor="middle" fill="#77746B" font-size="10">2025</text>
    <text x="650" y="180" text-anchor="middle" fill="#F4F1E8" font-size="9">SYSTEMS</text>
  </g>

  <g>
    <circle cx="900" cy="220" r="13" fill="#171311" stroke="#E4572E">
      <animate attributeName="r" values="11;17;11" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="900" y="260" text-anchor="middle" fill="#77746B" font-size="10">2026</text>
    <text x="900" y="180" text-anchor="middle" fill="#E4572E" font-size="9">DBER</text>
  </g>

  <g>
    <circle cx="1100" cy="220" r="7" fill="#62D38A">
      <animate attributeName="r" values="5;10;5" dur="1.7s" repeatCount="indefinite"/>
    </circle>

    <text x="1100" y="260" text-anchor="middle" fill="#62D38A" font-size="10">NOW</text>
    <text x="1100" y="180" text-anchor="middle" fill="#77746B" font-size="9">NEXT</text>
  </g>
</g>

<!-- moving marker -->
<circle r="5" fill="#F4F1E8">
  <animateMotion
    dur="6s"
    repeatCount="indefinite"
    path="M100 220L1100 220"/>
</circle>

<text x="600" y="330"
      text-anchor="middle"
      fill="#55534D"
      font-family="monospace"
      font-size="9">
  NOT A DESTINATION — A DIRECTION
</text>
</svg>
