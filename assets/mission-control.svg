<svg width="1200" height="580" viewBox="0 0 1200 580" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="580">
    <stop stop-color="#090908"/>
    <stop offset="1" stop-color="#11110F"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<rect width="1200" height="580" rx="24" fill="url(#bg)"/>

<text x="52" y="55"
      fill="#F4F1E8"
      font-family="monospace"
      font-size="15"
      letter-spacing="4">
  MISSION CONTROL / HEALTH
</text>

<text x="52" y="82"
      fill="#68665F"
      font-family="monospace"
      font-size="11">
  systems are observed, not assumed
</text>

<!-- status cards -->
<g font-family="monospace">
  <rect x="55" y="120" width="250" height="90" rx="12"
        fill="#11110F" stroke="#292927"/>
  <circle cx="82" cy="150" r="5" fill="#62D38A"/>
  <text x="100" y="154" fill="#77746B" font-size="9">API</text>
  <text x="75" y="185" fill="#F4F1E8" font-size="17">99.9%</text>
  <text x="185" y="185" fill="#62D38A" font-size="9">HEALTHY</text>

  <rect x="325" y="120" width="250" height="90" rx="12"
        fill="#11110F" stroke="#292927"/>
  <circle cx="352" cy="150" r="5" fill="#62D38A"/>
  <text x="370" y="154" fill="#77746B" font-size="9">DATABASE</text>
  <text x="345" y="185" fill="#F4F1E8" font-size="17">READY</text>
  <text x="470" y="185" fill="#62D38A" font-size="9">CONNECTED</text>

  <rect x="595" y="120" width="250" height="90" rx="12"
        fill="#11110F" stroke="#292927"/>
  <circle cx="622" cy="150" r="5" fill="#D6A756"/>
  <text x="640" y="154" fill="#77746B" font-size="9">QUEUE</text>
  <text x="615" y="185" fill="#F4F1E8" font-size="17">12</text>
  <text x="690" y="185" fill="#D6A756" font-size="9">PENDING</text>

  <rect x="865" y="120" width="280" height="90" rx="12"
        fill="#11110F" stroke="#292927"/>
  <circle cx="892" cy="150" r="5" fill="#62D38A"/>
  <text x="910" y="154" fill="#77746B" font-size="9">WORKERS</text>
  <text x="885" y="185" fill="#F4F1E8" font-size="17">4 / 4</text>
  <text x="980" y="185" fill="#62D38A" font-size="9">RUNNING</text>
</g>

<!-- heartbeat -->
<rect x="55" y="240" width="690" height="270" rx="14"
      fill="#0D0D0C" stroke="#292927"/>

<text x="80" y="275"
      fill="#77746B"
      font-family="monospace"
      font-size="9">
  SYSTEM HEARTBEAT
</text>

<path
  d="M80 390
     H180
     L205 390
     L225 345
     L250 435
     L280 390
     H350
     L375 365
     L395 410
     L420 390
     H520
     L545 350
     L570 430
     L600 390
     H690"
  stroke="#62D38A"
  stroke-width="3"
  fill="none"/>

<path
  d="M80 390
     H180
     L205 390
     L225 345
     L250 435
     L280 390
     H350
     L375 365
     L395 410
     L420 390
     H520
     L545 350
     L570 430
     L600 390
     H690"
  stroke="#62D38A"
  stroke-width="12"
  opacity=".12"
  filter="url(#glow)"
  fill="none"/>

<circle cx="690" cy="390" r="6" fill="#62D38A">
  <animate attributeName="r" values="5;10;5" dur="1.5s" repeatCount="indefinite"/>
</circle>

<!-- event stream -->
<rect x="775" y="240" width="370" height="270" rx="14"
      fill="#0D0D0C" stroke="#292927"/>

<text x="800" y="275"
      fill="#77746B"
      font-family="monospace"
      font-size="9">
  EVENT STREAM
</text>

<g font-family="monospace" font-size="9">
  <text x="800" y="315" fill="#55534D">21:04:01</text>
  <text x="875" y="315" fill="#E4572E">order.created</text>

  <text x="800" y="350" fill="#55534D">21:04:02</text>
  <text x="875" y="350" fill="#D6A756">payment.authorized</text>

  <text x="800" y="385" fill="#55534D">21:04:03</text>
  <text x="875" y="385" fill="#8B7CFF">audit.recorded</text>

  <text x="800" y="420" fill="#55534D">21:04:04</text>
  <text x="875" y="420" fill="#62D38A">outbox.processed</text>

  <text x="800" y="455" fill="#55534D">21:04:05</text>
  <text x="875" y="455" fill="#62D38A">completed</text>
</g>

<!-- scanning line -->
<rect x="790" y="292" width="330" height="1" fill="#62D38A" opacity=".5">
  <animate attributeName="y" values="292;480;292" dur="4s" repeatCount="indefinite"/>
</rect>

<text x="600" y="545"
      text-anchor="middle"
      fill="#55534D"
      font-family="monospace"
      font-size="9">
  OBSERVE → DETECT → RECOVER
</text>
</svg>
