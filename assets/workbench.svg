    <text x="20" y="138" fill="#96938A" font-family="monospace" font-size="12">Tailwind</text>
    <path d="M20 158H230" stroke="#292927"/>
    <text x="20" y="178" fill="#5F5D57" font-family="monospace" font-size="9">interaction / composition / UX</text>
  </g>

  <!-- backend -->
