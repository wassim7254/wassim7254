
<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="390" rx="18" fill="#0B0B0A"/>
  <rect x="1" y="1" width="1198" height="388" rx="17" stroke="#292927"/>

