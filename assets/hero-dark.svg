<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Wassim Ahabchane — Software Engineer</title>
<desc id="desc">Animated software engineering profile showing Wassim's development stack, systems work and DBER architecture.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#09090b"/>
    <stop offset=".5" stop-color="#111113"/>
    <stop offset="1" stop-color="#18181b"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#fb7185"/>
    <stop offset=".45" stop-color="#f97316"/>
    <stop offset="1" stop-color="#facc15"/>
  </linearGradient>

  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#34d399"/>
    <stop offset="1" stop-color="#22c55e"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#6366f1"/>
  </linearGradient>

  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>

  <pattern id="cells" width="22" height="22" patternUnits="userSpaceOnUse">
    <rect x="2" y="2" width="16" height="16" rx="3" fill="#27272a"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <clipPath id="activityClip">
    <rect x="74" y="356" width="1052" height="170" rx="14"/>
  </clipPath>

  <style>
    .m {
      font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
    }

    .white { fill:#fafafa; }
    .muted { fill:#a1a1aa; }
    .dim { fill:#71717a; }
    .orange { fill:#fb923c; }
    .green { fill:#4ade80; }
    .purple { fill:#a78bfa; }
    .blue { fill:#60a5fa; }
    .red { fill:#fb7185; }
    .panel {
      fill:#111113;
      stroke:#27272a;
      stroke-width:1;
    }
  </style>
</defs>

<!-- BACKGROUND -->

<rect width="1200" height="900" rx="32" fill="url(#bg)"/>
<rect width="1200" height="900" rx="32" fill="url(#grid)"/>

<circle cx="1040" cy="90" r="190" fill="#f97316" opacity=".035" filter="url(#soft)"/>
<circle cx="180" cy="650" r="230" fill="#6366f1" opacity=".025" filter="url(#soft)"/>

<!-- OUTER FRAME -->

<rect x="24" y="24" width="1152" height="852" rx="26"
      fill="none" stroke="#27272a"/>

<!-- TOP TERMINAL -->

<rect x="48" y="48" width="1104" height="64" rx="14"
      fill="#0a0a0b" stroke="#27272a"/>

<circle cx="76" cy="80" r="6" fill="#fb7185"/>
<circle cx="97" cy="80" r="6" fill="#fbbf24"/>
<circle cx="118" cy="80" r="6" fill="#34d399"/>

<text x="146" y="85" class="m white" font-size="14" font-weight="700">
  wassim@github: ~/profile
</text>

<text x="1125" y="85" text-anchor="end"
      class="m green" font-size="11" font-weight="800">
  SOFTWARE ENGINEER
</text>

<!-- HERO -->

<text x="70" y="165" class="m orange" font-size="11" font-weight="900">
  00 / IDENTITY
</text>

<text x="70" y="214" class="m white" font-size="42" font-weight="900">
  WASSIM AHABCHANE
</text>

<text x="70" y="250" class="m muted" font-size="17">
  software engineer · full-stack developer · systems builder
</text>

<text x="70" y="288" class="m dim" font-size="12">
  building interfaces, backend systems and transactional software.
</text>

<!-- STATUS -->

<rect x="850" y="158" width="276" height="48" rx="10"
      fill="#101b15" stroke="#166534"/>

<circle cx="878" cy="182" r="5" fill="#22c55e" filter="url(#glow)">
  <animate attributeName="opacity"
           values=".3;1;.3"
           dur="1.6s"
           repeatCount="indefinite"/>
</circle>

<text x="895" y="187" class="m green" font-size="11" font-weight="800">
  BUILDING / LEARNING
</text>

<!-- DIVIDER -->

<line x1="70" y1="316" x2="1130" y2="316"
      stroke="#27272a"/>

<!-- ACTIVITY -->

<text x="70" y="342" class="m white" font-size="12" font-weight="900">
  GITHUB ACTIVITY
</text>

<text x="1130" y="342" text-anchor="end"
      class="m dim" font-size="10">
  CONTRIBUTION WAVE
</text>

<rect x="70" y="356" width="1060" height="174" rx="14"
      fill="#0d0d0f" stroke="#27272a"/>

<g clip-path="url(#activityClip)">

  <rect x="90" y="378" width="1020" height="130"
        fill="url(#cells)"/>

  <path d="M-100 454
           C40 390 110 520 250 448
           S470 388 610 455
           S850 520 1140 415
           L1140 550
           L-100 550 Z"
        fill="url(#accent)"
        opacity=".7">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="-70 0;70 0;-70 0"
      dur="6s"
      repeatCount="indefinite"/>
  </path>

  <path d="M-100 480
           C60 420 170 550 310 478
           S520 420 690 480
           S930 540 1160 445
           L1160 550
           L-100 550 Z"
        fill="url(#green)"
        opacity=".35">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="80 0;-80 0;80 0"
      dur="8s"
      repeatCount="indefinite"/>
  </path>

  <path d="M-40 446
           C110 386 205 515 340 445
           S565 388 700 448
           S910 515 1110 420"
        fill="none"
        stroke="#fed7aa"
        stroke-width="2"
        opacity=".8">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="-70 0;70 0;-70 0"
      dur="6s"
      repeatCount="indefinite"/>
  </path>

</g>

<!-- ACTIVITY LEGEND -->

<text x="92" y="558" class="m dim" font-size="9">LESS</text>

<rect x="130" y="549" width="14" height="14" rx="3" fill="#27272a"/>
<rect x="150" y="549" width="14" height="14" rx="3" fill="#14532d"/>
<rect x="170" y="549" width="14" height="14" rx="3" fill="#15803d"/>
<rect x="190" y="549" width="14" height="14" rx="3" fill="#22c55e"/>
<rect x="210" y="549" width="14" height="14" rx="3" fill="#4ade80"/>

<text x="234" y="558" class="m dim" font-size="9">MORE</text>

<!-- LEFT PANEL -->

<rect x="70" y="590" width="510" height="238" rx="16" class="panel"/>

<text x="94" y="622" class="m orange" font-size="11" font-weight="900">
  01 / ABOUT
</text>

<text x="94" y="661" class="m white" font-size="24" font-weight="900">
  BUILDING FROM
</text>

<text x="94" y="690" class="m white" font-size="24" font-weight="900">
  UI TO DATABASE
</text>

<text x="94" y="725" class="m muted" font-size="12">
  TypeScript · Next.js · PostgreSQL
</text>

<text x="94" y="747" class="m muted" font-size="12">
  backend architecture · transactional systems
</text>

<rect x="94" y="773" width="190" height="34" rx="8"
      fill="#1c1917" stroke="#7c2d12"/>

<text x="189" y="795" text-anchor="middle"
      class="m orange" font-size="9" font-weight="900">
  BUILDING EVERY DAY
</text>

<!-- RIGHT PANEL -->

<rect x="604" y="590" width="526" height="238" rx="16" class="panel"/>

<!-- MINI TERMINAL -->

<rect x="626" y="612" width="482" height="40" rx="9"
      fill="#09090b" stroke="#27272a"/>

<circle cx="648" cy="632" r="4" fill="#fb7185"/>
<circle cx="663" cy="632" r="4" fill="#fbbf24"/>
<circle cx="678" cy="632" r="4" fill="#34d399"/>

<text x="700" y="637" class="m purple" font-size="11" font-weight="900">
  developer.ts
</text>

<!-- CODE -->

<text x="636" y="682" class="m dim" font-size="10">01</text>
<text x="668" y="682" class="m purple" font-size="13" font-weight="900">const</text>
<text x="720" y="682" class="m white" font-size="13">wassim = {</text>

<text x="636" y="709" class="m dim" font-size="10">02</text>
<text x="668" y="709" class="m purple" font-size="13" font-weight="900">role:</text>
<text x="722" y="709" class="m orange" font-size="13">
  "software engineer",
</text>

<text x="636" y="736" class="m dim" font-size="10">03</text>
<text x="668" y="736" class="m purple" font-size="13" font-weight="900">focus:</text>
<text x="730" y="736" class="m orange" font-size="13">
  "full-stack systems",
</text>

<text x="636" y="763" class="m dim" font-size="10">04</text>
<text x="668" y="763" class="m purple" font-size="13" font-weight="900">building:</text>
<text x="750" y="763" class="m green" font-size="13">
  "DBER"
</text>

<text x="668" y="790" class="m white" font-size="13">
  };
</text>

<!-- FLOATING SYSTEM INDICATORS -->

<g opacity=".8">

  <rect x="1005" y="255" width="118" height="28" rx="7"
        fill="#111827" stroke="#374151"/>

  <circle cx="1021" cy="269" r="3" fill="#60a5fa">
    <animate attributeName="opacity"
             values=".2;1;.2"
             dur="1.8s"
             repeatCount="indefinite"/>
  </circle>

  <text x="1032" y="273" class="m blue" font-size="8">
    SYSTEMS
  </text>

</g>

<g opacity=".8">

  <rect x="865" y="255" width="118" height="28" rx="7"
        fill="#111827" stroke="#374151"/>

  <circle cx="881" cy="269" r="3" fill="#4ade80">
    <animate attributeName="opacity"
             values="1;.2;1"
             dur="1.8s"
             repeatCount="indefinite"/>
  </circle>

  <text x="892" y="273" class="m green" font-size="8">
    TYPESCRIPT
  </text>

</g>

<!-- FOOTER SIGNAL -->

<line x1="70" y1="850" x2="1130" y2="850"
      stroke="#27272a"/>

<text x="70" y="868" class="m dim" font-size="8">
  WASSIM AHABCHANE / SOFTWARE ENGINEER
</text>

<text x="1130" y="868" text-anchor="end"
      class="m dim" font-size="8">
  2026
</text>

</svg>
