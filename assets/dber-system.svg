  <!-- connectors -->
  <path d="M215 260V300H600" stroke="#292927" stroke-width="2"/>
  <path d="M600 260V300" stroke="#292927" stroke-width="2"/>
  <path d="M985 260V300H600" stroke="#292927" stroke-width="2"/>

